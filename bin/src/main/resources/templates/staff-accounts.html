<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="fragments/layout :: layout('Staff Accounts', ~{::section}, 'staff-accounts')">
<section>
	<div class="container-xxl flex-grow-1 container-p-y">
		<h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Staff /</span> Staff Account Form</h4>
		<div class="row">
			<div class="col-xl">
				<div class="card mb-4">
					<div class="card-header d-flex justify-content-between align-items-center">
						<h5 class="mb-0">Staff Account Form</h5>
						<small class="text-muted float-end">Staff Account Form</small>
					</div>
					<div class="card-body">
						<form id="staff-form">
							<input type="hidden" id="staff-id" />
							<div class="row g-3">
								<div class="mb-3 col-md-4">
									<label class="form-label" for="staff-first-name">First
										Name</label>
									<input class="form-control" id="staff-first-name"
										placeholder="First name" />
								</div>
								<div class="mb-3 col-md-4">
									<label class="form-label" for="staff-last-name">Last Name</label>
									<input class="form-control" id="staff-last-name"
										placeholder="Last name" />
								</div>
								<div class="mb-3 col-md-4">
									<label class="form-label" for="staff-phone">Phone</label>
									<input class="form-control" id="staff-phone"
										placeholder="Phone" />
								</div>
								<div class="mb-3 col-md-4">
									<label class="form-label" for="staff-email">Email</label>
									<input class="form-control" id="staff-email" type="email"
										placeholder="name@example.com" />
								</div>
								<div class="mb-3 col-md-4">
									<label class="form-label" for="staff-password">Password</label>
									<input class="form-control" id="staff-password" type="password"
										placeholder="Password" />
									<small class="text-muted">Leave blank to keep current
										password.</small>
								</div>
								<div class="mb-3 col-md-4">
									<label class="form-label" for="staff-profile">Profile
										Image</label>
									<input class="form-control" id="staff-profile" type="file"
										accept="image/*" />
									<input id="staff-profile-existing" type="hidden" />
									<div class="mt-2">
										<img id="staff-profile-preview" alt="Preview"
											style="max-height: 80px; display: none;" />
									</div>
								</div>
								<div class="mb-3 col-md-4 d-flex align-items-end">
									<div class="form-check">
										<input class="form-check-input" type="checkbox"
											id="staff-active" />
										<label class="form-check-label"
											for="staff-active">Active</label>
									</div>
								</div>
								<div class="col-12 d-flex gap-2">
									<button class="btn btn-primary" type="submit"
										id="staff-submit">Add Staff</button>
									<button class="btn btn-outline-secondary" type="button"
										id="staff-reset">Clear</button>
								</div>
								<div class="col-12">
									<small class="text-danger" id="staff-error"
										style="display:none;"></small>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
		<div class="card">
			<h5 class="card-header">Staff Accounts List</h5>
			<div class="table-responsive text-nowrap">
				<table class="table">
					<thead>
						<tr>
							<th>ID</th>
							<th>Name</th>
							<th>Email</th>
							<th>Phone</th>
							<th>Active</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody class="table-border-bottom-0">
						<tr th:each="staff : ${staffAccounts}" th:attr="data-id=${staff.id},
								data-first-name=${staff.firstName},
								data-last-name=${staff.lastName},
								data-phone=${staff.phoneNumber},
								data-email=${staff.email},
								data-active=${staff.active},
								data-profile=${staff.profileImg}">
							<td th:text="${staff.id}"></td>
							<td th:text="${staff.firstName} + ' ' + ${staff.lastName}"></td>
							<td th:text="${staff.email}"></td>
							<td th:text="${staff.phoneNumber}"></td>
							<td th:text="${staff.active}"></td>
							<td>
								<div class="dropdown">
									<button type="button" class="btn p-0 dropdown-toggle hide-arrow"
										data-bs-toggle="dropdown">
										<i class="bx bx-dots-vertical-rounded"></i>
									</button>
									<div class="dropdown-menu">
										<button class="dropdown-item btn-edit" type="button"><i
												class="bx bx-edit-alt me-1"></i> Edit</button>
										<button class="dropdown-item btn-delete" type="button"><i
												class="bx bx-trash me-1"></i> Delete</button>
									</div>
								</div>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(staffAccounts)}">
							<td>No staff accounts found.</td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<hr class="my-5" />
	</div>

	<script>
		(() => {
			const form = document.getElementById("staff-form");
			const idInput = document.getElementById("staff-id");
			const firstNameInput = document.getElementById("staff-first-name");
			const lastNameInput = document.getElementById("staff-last-name");
			const phoneInput = document.getElementById("staff-phone");
			const emailInput = document.getElementById("staff-email");
			const passwordInput = document.getElementById("staff-password");
			const profileInput = document.getElementById("staff-profile");
			const existingProfileInput = document.getElementById("staff-profile-existing");
			const profilePreview = document.getElementById("staff-profile-preview");
			const activeInput = document.getElementById("staff-active");
			const submitBtn = document.getElementById("staff-submit");
			const resetBtn = document.getElementById("staff-reset");
			const errorEl = document.getElementById("staff-error");

			const clearForm = () => {
				idInput.value = "";
				firstNameInput.value = "";
				lastNameInput.value = "";
				phoneInput.value = "";
				emailInput.value = "";
				passwordInput.value = "";
				profileInput.value = "";
				existingProfileInput.value = "";
				profilePreview.src = "";
				profilePreview.style.display = "none";
				activeInput.checked = false;
				passwordInput.required = true;
				submitBtn.textContent = "Add Staff";
				errorEl.style.display = "none";
				errorEl.textContent = "";
			};

			const showError = (message) => {
				errorEl.textContent = message;
				errorEl.style.display = "block";
			};

			resetBtn.addEventListener("click", clearForm);

			profileInput.addEventListener("change", () => {
				const selectedFile = profileInput.files && profileInput.files[0];
				if (!selectedFile) {
					profilePreview.src = "";
					profilePreview.style.display = "none";
					return;
				}
				const previewUrl = URL.createObjectURL(selectedFile);
				profilePreview.src = previewUrl;
				profilePreview.style.display = "inline-block";
			});

			const uploadImage = async (file) => {
				const formData = new FormData();
				formData.append("file", file);
				const response = await fetch("/api/uploads/staff", {
					method: "POST",
					body: formData
				});
				if (!response.ok) {
					const text = await response.text();
					throw new Error(text || "Image upload failed.");
				}
				const data = await response.json();
				return data.url;
			};

			form.addEventListener("submit", async (event) => {
				event.preventDefault();
				errorEl.style.display = "none";
				submitBtn.disabled = true;

				const isUpdate = Boolean(idInput.value);
				const selectedFile = profileInput.files && profileInput.files[0];
				let profileValue = existingProfileInput.value.trim() || null;
				if (selectedFile) {
					profileValue = await uploadImage(selectedFile);
				}

				const payload = {
					firstName: firstNameInput.value.trim() || null,
					lastName: lastNameInput.value.trim() || null,
					phoneNumber: phoneInput.value.trim() || null,
					email: emailInput.value.trim() || null,
					password: passwordInput.value.trim(),
					active: activeInput.checked,
					profileImg: profileValue
				};

				if (!payload.password) {
					if (!isUpdate) {
						showError("Password is required.");
						submitBtn.disabled = false;
						return;
					}
					payload.password = null;
				}

				try {
					const id = idInput.value;
					const url = id ? `/api/admin/staff-accounts/${id}` : "/api/admin/staff-accounts";
					const method = id ? "PUT" : "POST";
					const response = await fetch(url, {
						method,
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify(payload)
					});

					if (!response.ok) {
						const text = await response.text();
						throw new Error(text || "Save failed.");
					}

					window.location.reload();
				} catch (err) {
					showError(err.message || "Something went wrong.");
				} finally {
					submitBtn.disabled = false;
				}
			});

			document.querySelectorAll(".btn-edit").forEach((btn) => {
				btn.addEventListener("click", () => {
					const row = btn.closest("tr");
					idInput.value = row.dataset.id || "";
					firstNameInput.value = row.dataset.firstName || "";
					lastNameInput.value = row.dataset.lastName || "";
					phoneInput.value = row.dataset.phone || "";
					emailInput.value = row.dataset.email || "";
					passwordInput.value = "";
					profileInput.value = "";
					existingProfileInput.value = row.dataset.profile || "";
					if (existingProfileInput.value) {
						profilePreview.src = existingProfileInput.value;
						profilePreview.style.display = "inline-block";
					} else {
						profilePreview.src = "";
						profilePreview.style.display = "none";
					}
					activeInput.checked = row.dataset.active === "true";
					passwordInput.required = false;
					submitBtn.textContent = "Update Staff";
					errorEl.style.display = "none";
				});
			});

			document.querySelectorAll(".btn-delete").forEach((btn) => {
				btn.addEventListener("click", async () => {
					const row = btn.closest("tr");
					const id = row.dataset.id;
					if (!id) {
						return;
					}
					if (!confirm("Delete this staff account?")) {
						return;
					}
					try {
						const response = await fetch(`/api/admin/staff-accounts/${id}`, { method: "DELETE" });
						if (!response.ok) {
							const text = await response.text();
							throw new Error(text || "Delete failed.");
						}
						window.location.reload();
					} catch (err) {
						showError(err.message || "Something went wrong.");
					}
				});
			});

			clearForm();
			dataTables(".table", { pageLength: 10 });
		})();
	</script>
</section>

</html>
