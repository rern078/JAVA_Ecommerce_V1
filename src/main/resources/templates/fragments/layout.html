	<script src="/server/assets/vendor/js/helpers.js"></script>
	<script src="/server/assets/js/config.js"></script>
	<script>
		const dataTables = (selector = ".table", options = {}) => {
			const init = () => {
				if (!window.jQuery || !jQuery.fn || !jQuery.fn.DataTable) {
					return;
				}
				const $table = jQuery(selector);
				if ($table.length === 0) {
					return;
				}
				if (jQuery.fn.DataTable.isDataTable($table)) {
					return;
				}
				$table.DataTable(options);
			};

			if (!window.jQuery || !jQuery.fn || !jQuery.fn.DataTable) {
				window.addEventListener("load", init, { once: true });
				return;
			}
			init();
		};
	</script>
	<style>
		.dataTables_info,
		.dataTables_paginate,
		.dataTables_length,
		.dataTables_filter {
			padding: 1.5rem 1.5rem;
		}
	</style>
</head>
