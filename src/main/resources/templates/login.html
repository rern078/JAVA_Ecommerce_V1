<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Login</title>
	<style>
		body { font-family: Arial, sans-serif; margin: 24px; color: #1f2937; }
		.container { max-width: 380px; margin: 40px auto; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; }
		label { display: block; margin-top: 12px; }
		input { width: 100%; padding: 8px; margin-top: 6px; }
		button { margin-top: 16px; width: 100%; padding: 10px; }
		.error { color: #b91c1c; margin-top: 10px; }
	</style>
</head>
<body>
<div class="container">
	<h2>Login</h2>
	<form method="post" action="/login">
		<label>Email
			<input type="email" name="email" required>
		</label>
		<label>Password
			<input type="password" name="password" required>
		</label>
		<button type="submit">Login</button>
	</form>
	<p class="error" th:if="${error}" th:text="${error}">Invalid email or password.</p>
	<p>New here? <a href="/register">Create an account</a></p>
</div>
</body>
</html>
