<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="fragments/layout :: layout('Roles', ~{::section}, 'roles')">
<section>
	<div class="container-xxl flex-grow-1 container-p-y">
		<h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Roles /</span> Role Form</h4>
		<div class="row">
			<div class="col-xl">
				<div class="card mb-4">
					<div class="card-header d-flex justify-content-between align-items-center">
						<h5 class="mb-0">Role Form</h5>
						<small class="text-muted float-end">Role Form</small>
					</div>
					<div class="card-body">
						<form id="role-form">
							<input type="hidden" id="role-id" />
							<div class="row g-3">
								<div class="mb-3 col-md-4">
									<label class="form-label" for="role-name">Role Name</label>
									<input class="form-control" id="role-name" placeholder="Admin"
										required />
								</div>
								<div class="mb-3 col-md-8">
									<label class="form-label" for="role-privileges">Privileges</label>
									<input class="form-control" id="role-privileges"
										placeholder="read,write" />
								</div>
								<div class="col-12 d-flex gap-2">
									<button class="btn btn-primary" type="submit" id="role-submit">Add Role</button>
									<button class="btn btn-outline-secondary" type="button"
										id="role-reset">Clear</button>
								</div>
								<div class="col-12">
									<small class="text-danger" id="role-error" style="display:none;"></small>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
		<div class="card">
			<h5 class="card-header">Roles List</h5>
			<div class="table-responsive text-nowrap">
				<table class="table">
					<thead>
						<tr>
							<th>ID</th>
							<th>Role Name</th>
							<th>Privileges</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody class="table-border-bottom-0">
						<tr th:each="role : ${roles}"
							th:attr="data-id=${role.id},
								data-name=${role.roleName},
								data-privileges=${role.privileges}">
							<td th:text="${role.id}"></td>
							<td th:text="${role.roleName}"></td>
							<td th:text="${role.privileges}"></td>
							<td>
								<div class="dropdown">
									<button type="button" class="btn p-0 dropdown-toggle hide-arrow"
										data-bs-toggle="dropdown">
										<i class="bx bx-dots-vertical-rounded"></i>
									</button>
									<div class="dropdown-menu">
										<button class="dropdown-item btn-edit" type="button"><i
												class="bx bx-edit-alt me-1"></i> Edit</button>
										<button class="dropdown-item btn-delete" type="button"><i
												class="bx bx-trash me-1"></i> Delete</button>
									</div>
								</div>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(roles)}">
							<td>No roles found.</td>
							<td></td>
							<td></td>
							<td></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<hr class="my-5" />
	</div>

	<script>
		(() => {
			const form = document.getElementById("role-form");
			const idInput = document.getElementById("role-id");
			const nameInput = document.getElementById("role-name");
			const privilegesInput = document.getElementById("role-privileges");
			const submitBtn = document.getElementById("role-submit");
			const resetBtn = document.getElementById("role-reset");
			const errorEl = document.getElementById("role-error");

			const clearForm = () => {
				idInput.value = "";
				nameInput.value = "";
				privilegesInput.value = "";
				submitBtn.textContent = "Add Role";
				errorEl.style.display = "none";
				errorEl.textContent = "";
			};

			const showError = (message) => {
				errorEl.textContent = message;
				errorEl.style.display = "block";
			};

			resetBtn.addEventListener("click", clearForm);

			form.addEventListener("submit", async (event) => {
				event.preventDefault();
				errorEl.style.display = "none";
				submitBtn.disabled = true;

				const payload = {
					roleName: nameInput.value.trim(),
					privileges: privilegesInput.value.trim() || null
				};

				try {
					const id = idInput.value;
					const url = id ? `/api/admin/roles/${id}` : "/api/admin/roles";
					const method = id ? "PUT" : "POST";
					const response = await fetch(url, {
						method,
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify(payload)
					});

					if (!response.ok) {
						const text = await response.text();
						throw new Error(text || "Save failed.");
					}

					window.location.reload();
				} catch (err) {
					showError(err.message || "Something went wrong.");
				} finally {
					submitBtn.disabled = false;
				}
			});

			document.querySelectorAll(".btn-edit").forEach((btn) => {
				btn.addEventListener("click", () => {
					const row = btn.closest("tr");
					idInput.value = row.dataset.id || "";
					nameInput.value = row.dataset.name || "";
					privilegesInput.value = row.dataset.privileges || "";
					submitBtn.textContent = "Update Role";
					errorEl.style.display = "none";
				});
			});

			document.querySelectorAll(".btn-delete").forEach((btn) => {
				btn.addEventListener("click", async () => {
					const row = btn.closest("tr");
					const id = row.dataset.id;
					if (!id) {
						return;
					}
					if (!confirm("Delete this role?")) {
						return;
					}
					try {
						const response = await fetch(`/api/admin/roles/${id}`, { method: "DELETE" });
						if (!response.ok) {
							const text = await response.text();
							throw new Error(text || "Delete failed.");
						}
						window.location.reload();
					} catch (err) {
						showError(err.message || "Something went wrong.");
					}
				});
			});

			clearForm();
			dataTables(".table", { pageLength: 10 });
		})();
	</script>
</section>

</html>
