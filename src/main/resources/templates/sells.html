<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="fragments/layout :: layout('Sells', ~{::section}, 'sells')">
<section>
	<div class="container-xxl flex-grow-1 container-p-y">
		<h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Sells /</span> Sell Form</h4>
		<div class="row">
			<div class="col-xl">
				<div class="card mb-4">
					<div class="card-header d-flex justify-content-between align-items-center">
						<h5 class="mb-0">Sell Form</h5>
						<small class="text-muted float-end">Sell Form</small>
					</div>
					<div class="card-body">
						<form id="sell-form">
							<input type="hidden" id="sell-id" />
							<div class="row g-3">
								<div class="mb-3 col-md-4">
									<label class="form-label" for="sell-product">Product</label>
									<select class="form-select" id="sell-product" required>
										<option value="">Select product</option>
										<option th:each="product : ${products}"
											th:value="${product.id}"
											th:text="${product.name}">
										</option>
									</select>
								</div>
								<div class="mb-3 col-md-4">
									<label class="form-label" for="sell-price">Price</label>
									<input class="form-control" id="sell-price" type="number"
										step="0.01" min="0" placeholder="0.00" />
								</div>
								<div class="mb-3 col-md-4">
									<label class="form-label" for="sell-quantity">Quantity</label>
									<input class="form-control" id="sell-quantity" type="number"
										min="0" placeholder="0" />
								</div>
								<div class="col-12 d-flex gap-2">
									<button class="btn btn-primary" type="submit" id="sell-submit">Add Sell</button>
									<button class="btn btn-outline-secondary" type="button"
										id="sell-reset">Clear</button>
								</div>
								<div class="col-12">
									<small class="text-danger" id="sell-error" style="display:none;"></small>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
		<div class="card">
			<h5 class="card-header">Sells List</h5>
			<div class="table-responsive text-nowrap">
				<table class="table">
					<thead>
						<tr>
							<th>ID</th>
							<th>Product</th>
							<th>Price</th>
							<th>Quantity</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody class="table-border-bottom-0">
						<tr th:each="sell : ${sells}"
							th:attr="data-id=${sell.id},
								data-product-id=${sell.product != null ? sell.product.id : ''},
								data-price=${sell.price},
								data-quantity=${sell.quantity}">
							<td th:text="${sell.id}"></td>
							<td th:text="${sell.product != null ? sell.product.name : '-'}"></td>
							<td th:text="${sell.price}"></td>
							<td th:text="${sell.quantity}"></td>
							<td>
								<div class="dropdown">
									<button type="button" class="btn p-0 dropdown-toggle hide-arrow"
										data-bs-toggle="dropdown">
										<i class="bx bx-dots-vertical-rounded"></i>
									</button>
									<div class="dropdown-menu">
										<button class="dropdown-item btn-edit" type="button"><i
												class="bx bx-edit-alt me-1"></i> Edit</button>
										<button class="dropdown-item btn-delete" type="button"><i
												class="bx bx-trash me-1"></i> Delete</button>
									</div>
								</div>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(sells)}">
							<td>No sells found.</td>
							<td></td>
							<td></td>
							<td></td>
							<td></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<hr class="my-5" />
	</div>

	<script>
		(() => {
			const form = document.getElementById("sell-form");
			const idInput = document.getElementById("sell-id");
			const productInput = document.getElementById("sell-product");
			const priceInput = document.getElementById("sell-price");
			const quantityInput = document.getElementById("sell-quantity");
			const submitBtn = document.getElementById("sell-submit");
			const resetBtn = document.getElementById("sell-reset");
			const errorEl = document.getElementById("sell-error");

			const clearForm = () => {
				idInput.value = "";
				productInput.value = "";
				priceInput.value = "";
				quantityInput.value = "";
				submitBtn.textContent = "Add Sell";
				errorEl.style.display = "none";
				errorEl.textContent = "";
			};

			const showError = (message) => {
				errorEl.textContent = message;
				errorEl.style.display = "block";
			};

			resetBtn.addEventListener("click", clearForm);

			form.addEventListener("submit", async (event) => {
				event.preventDefault();
				errorEl.style.display = "none";
				submitBtn.disabled = true;

				const payload = {
					productId: productInput.value ? Number(productInput.value) : null,
					price: priceInput.value ? Number(priceInput.value) : null,
					quantity: quantityInput.value ? Number(quantityInput.value) : null
				};

				try {
					const id = idInput.value;
					const url = id ? `/api/admin/sells/${id}` : "/api/admin/sells";
					const method = id ? "PUT" : "POST";
					const response = await fetch(url, {
						method,
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify(payload)
					});

					if (!response.ok) {
						const text = await response.text();
						throw new Error(text || "Save failed.");
					}

					window.location.reload();
				} catch (err) {
					showError(err.message || "Something went wrong.");
				} finally {
					submitBtn.disabled = false;
				}
			});

			document.querySelectorAll(".btn-edit").forEach((btn) => {
				btn.addEventListener("click", () => {
					const row = btn.closest("tr");
					idInput.value = row.dataset.id || "";
					productInput.value = row.dataset.productId || "";
					priceInput.value = row.dataset.price || "";
					quantityInput.value = row.dataset.quantity || "";
					submitBtn.textContent = "Update Sell";
					errorEl.style.display = "none";
				});
			});

			document.querySelectorAll(".btn-delete").forEach((btn) => {
				btn.addEventListener("click", async () => {
					const row = btn.closest("tr");
					const id = row.dataset.id;
					if (!id) {
						return;
					}
					if (!confirm("Delete this sell?")) {
						return;
					}
					try {
						const response = await fetch(`/api/admin/sells/${id}`, { method: "DELETE" });
						if (!response.ok) {
							const text = await response.text();
							throw new Error(text || "Delete failed.");
						}
						window.location.reload();
					} catch (err) {
						showError(err.message || "Something went wrong.");
					}
				});
			});

			clearForm();
			dataTables(".table", { pageLength: 10 });
		})();
	</script>
</section>

</html>
