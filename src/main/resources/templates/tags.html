<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="fragments/layout :: layout('Tags', ~{::section}, 'tags')">
<section>
	<div class="container-xxl flex-grow-1 container-p-y">
		<h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Tags /</span> Tag Form</h4>
		<div class="row">
			<div class="col-xl">
				<div class="card mb-4">
					<div class="card-header d-flex justify-content-between align-items-center">
						<h5 class="mb-0">Tag Form</h5>
						<small class="text-muted float-end">Tag Form</small>
					</div>
					<div class="card-body">
						<form id="tag-form">
							<input type="hidden" id="tag-id" />
							<div class="row g-3">
								<div class="mb-3 col-md-6">
									<label class="form-label" for="tag-name">Tag Name</label>
									<input class="form-control" id="tag-name" placeholder="Tag name"
										required />
								</div>
								<div class="mb-3 col-md-6">
									<label class="form-label" for="tag-icon">Icon</label>
									<input class="form-control" id="tag-icon"
										placeholder="Icon class or URL" />
								</div>
								<div class="col-12 d-flex gap-2">
									<button class="btn btn-primary" type="submit" id="tag-submit">Add
										Tag</button>
									<button class="btn btn-outline-secondary" type="button"
										id="tag-reset">Clear</button>
								</div>
								<div class="col-12">
									<small class="text-danger" id="tag-error"
										style="display:none;"></small>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
		<div class="card">
			<h5 class="card-header">Tags List</h5>
			<div class="table-responsive text-nowrap">
				<table class="table">
					<thead>
						<tr>
							<th>ID</th>
							<th>Tag Name</th>
							<th>Icon</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody class="table-border-bottom-0">
						<tr th:each="tag : ${tags}" th:attr="data-id=${tag.id},
								data-name=${tag.tagName},
								data-icon=${tag.icon}">
							<td th:text="${tag.id}"></td>
							<td th:text="${tag.tagName}"></td>
							<td th:text="${tag.icon}"></td>
							<td>
								<div class="dropdown">
									<button type="button" class="btn p-0 dropdown-toggle hide-arrow"
										data-bs-toggle="dropdown">
										<i class="bx bx-dots-vertical-rounded"></i>
									</button>
									<div class="dropdown-menu">
										<button class="dropdown-item btn-edit" type="button"><i
												class="bx bx-edit-alt me-1"></i> Edit</button>
										<button class="dropdown-item btn-delete" type="button"><i
												class="bx bx-trash me-1"></i> Delete</button>
									</div>
								</div>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(tags)}">
							<td>No tags found.</td>
							<td></td>
							<td></td>
							<td></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<hr class="my-5" />
	</div>

	<script>
		(() => {
			const form = document.getElementById("tag-form");
			const idInput = document.getElementById("tag-id");
			const nameInput = document.getElementById("tag-name");
			const iconInput = document.getElementById("tag-icon");
			const submitBtn = document.getElementById("tag-submit");
			const resetBtn = document.getElementById("tag-reset");
			const errorEl = document.getElementById("tag-error");

			const clearForm = () => {
				idInput.value = "";
				nameInput.value = "";
				iconInput.value = "";
				submitBtn.textContent = "Add Tag";
				errorEl.style.display = "none";
				errorEl.textContent = "";
			};

			const showError = (message) => {
				errorEl.textContent = message;
				errorEl.style.display = "block";
			};

			resetBtn.addEventListener("click", clearForm);

			form.addEventListener("submit", async (event) => {
				event.preventDefault();
				errorEl.style.display = "none";
				submitBtn.disabled = true;

				const payload = {
					tagName: nameInput.value.trim(),
					icon: iconInput.value.trim() || null
				};

				try {
					const id = idInput.value;
					const url = id ? `/api/admin/tags/${id}` : "/api/admin/tags";
					const method = id ? "PUT" : "POST";
					const response = await fetch(url, {
						method,
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify(payload)
					});

					if (!response.ok) {
						const text = await response.text();
						throw new Error(text || "Save failed.");
					}

					window.location.reload();
				} catch (err) {
					showError(err.message || "Something went wrong.");
				} finally {
					submitBtn.disabled = false;
				}
			});

			document.querySelectorAll(".btn-edit").forEach((btn) => {
				btn.addEventListener("click", () => {
					const row = btn.closest("tr");
					idInput.value = row.dataset.id || "";
					nameInput.value = row.dataset.name || "";
					iconInput.value = row.dataset.icon || "";
					submitBtn.textContent = "Update Tag";
					errorEl.style.display = "none";
				});
			});

			document.querySelectorAll(".btn-delete").forEach((btn) => {
				btn.addEventListener("click", async () => {
					const row = btn.closest("tr");
					const id = row.dataset.id;
					if (!id) {
						return;
					}
					if (!confirm("Delete this tag?")) {
						return;
					}
					try {
						const response = await fetch(`/api/admin/tags/${id}`, { method: "DELETE" });
						if (!response.ok) {
							const text = await response.text();
							throw new Error(text || "Delete failed.");
						}
						window.location.reload();
					} catch (err) {
						showError(err.message || "Something went wrong.");
					}
				});
			});

			clearForm();
			dataTables(".table", { pageLength: 10 });
		})();
	</script>
</section>

</html>
